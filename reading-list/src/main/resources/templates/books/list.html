<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reading List</title>
</head>
<body>
<h1>My Reading List</h1>

<div th:if="${#lists.isEmpty(books)}">
    <p>Your Reading List is Empty</p>
</div>

<table border="2" th:if="${not #lists.isEmpty(books)}">
    <thead>
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Genre</th>
        <th>Pages</th>
        <th>Status</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td>
            <a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}">Title</a>
        </td>
        <td th:text="${book.author}">Author</td>
        <td th:text="${book.genre}">Genre</td>
        <td th:text="${book.pages}">0</td>
        <td th:text="${book.readingStatus}">Status</td>
    </tr>
    </tbody>
</table>

</body>
</html>
