<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::main})}">
<head>
    <title>Book Details</title>
</head>
<body>

<main>
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h3 class="mb-0" th:text="${book.title}">Book Title</h3>
            <span class="badge bg-light text-dark fs-6" th:text="${book.readingStatus}">STATUS</span>
        </div>

        <div class="card-body">
            <div class="row mb-3">
                <div class="col-md-6">
                    <p><strong>ID:</strong> <span th:text="${book.id}">1</span></p>
                    <p><strong>Author:</strong> <span th:text="${book.author}">Author Name</span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Genre:</strong> <span th:text="${book.genre}">Genre</span></p>
                    <p><strong>Pages:</strong> <span th:text="${book.pages}">0</span></p>
                </div>
            </div>

            <!-- Notes Section (Only renders if notes is not null and not empty) -->
            <div th:if="${book.notes != null and not #strings.isEmpty(book.notes)}" class="alert alert-secondary mt-3">
                <h5 class="alert-heading">Notes:</h5>
                <p class="mb-0" th:text="${book.notes}">Personal notes go here...</p>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex gap-2 mt-4">
                <!-- Edit Button -->
                <a th:href="@{/books/{id}/edit(id=${book.id})}" class="btn btn-warning">Edit</a>

                <!-- Delete Form -->
                <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post" style="display:inline;">
                    <input type="hidden" name="_method" value="DELETE" />
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this book?');">Delete</button>
                </form>

                <!-- Back Button -->
                <a th:href="@{/books}" class="btn btn-outline-secondary">Back to List</a>
            </div>
        </div>
    </div>
</main>

</body>
</html>
