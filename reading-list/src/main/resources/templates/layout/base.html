<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading List App</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS Link -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/books}">Reading List</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/books}">All Books</a>
            <a class="nav-link" th:href="@{/books/new}">Add New Book</a>
        </div>
    </div>
</nav>

<!-- Main Dynamic Content Area -->
<main class="container">
    <div th:replace="${content}">
        <!-- Page specific content replaces this block -->
    </div>
</main>

<!-- Bootstrap JS (Optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
